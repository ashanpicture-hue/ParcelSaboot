          "name": "Does Daraz accept ParcelSaboot videos as return claim proof?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Daraz seller claims go through a Seller Support form that asks for proof. ParcelSaboot gives you a continuous, uncut, timestamped clip tied to the order and a written statement. We cannot promise Daraz or any courier will accept a claim. The decision is theirs."
          }
        },
        {
          "@type": "Question",
          "name": "Will ParcelSaboot video hold up if a return claim goes further?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pakistani law accepts electronic records as evidence, and courts look for proof a video is genuine and unedited. Each clip is continuous, stamped with the time and order number, and fingerprinted when it is saved, so any change would show."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need special cameras for ParcelSaboot parcel recording?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. A phone on a stand or a basic USB webcam is enough. A barcode scanner makes it faster, but the phone camera can read labels too."
          }
        },
        {
          "@type": "Question",
          "name": "What if the internet or power goes out during packing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Clips save on the device and upload when the connection is back."
          }
        },
        {
          "@type": "Question",
          "name": "I sell on Instagram and WhatsApp. Is ParcelSaboot for me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Send the packing clip to a customer who disputes a parcel, and file courier claims for lost or damaged parcels on time."
          }
        },
        {
          "@type": "Question",
          "name": "Will ParcelSaboot file the claim for me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Daraz and the couriers do not offer a way for outside tools to file claims, so you submit each claim yourself. ParcelSaboot prepares the evidence and tells you the deadline."
          }
        },
        {
          "@type": "Question",
          "name": "Does ParcelSaboot connect to my courier or Daraz account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not in the first version. You scan the label or upload your booking or order sheet. Daraz and some couriers offer merchant APIs for orders and tracking, and we plan optional connections using your own API keys later."
          }
        },
        {
          "@type": "Question",
          "name": "Where are my videos stored?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "In private cloud storage run on Supabase, encrypted at rest. Only your store's logins can see them. A clip you share goes out as a private link that stops working after 30 days."
          }
        },
        {
          "@type": "Question",
          "name": "Why is each clip capped at 60 seconds?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A minute covers packing one parcel from empty box to sealed label. The phone shrinks each clip to about 720p before upload, so it sends quickly on mobile data and keeps storage costs, and our prices, low."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if I go over my parcel limit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Recording pauses for the rest of the month and your existing clips and claims stay available. Move up a plan at any time. If you pack more than 800 parcels a month, contact us."
          }
        },

          "@type": "Question",
          "name": "How long are videos kept?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "30 days on Free, 180 days on Standard and a full year on Growth. Videos linked to an open claim are kept until it closes."
